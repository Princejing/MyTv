name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 安装 Android SDK 组件
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: 生成 Debug APK（编译校验）
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: 整理 APK
        run: |
          mkdir -p dist
          cp tv/build/outputs/apk/debug/*.apk dist/
          cp mobile/build/outputs/apk/debug/*.apk dist/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: dist/*.apk
          if-no-files-found: warn
